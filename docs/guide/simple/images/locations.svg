<text x="178" y="596.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" fill="#202127" text-anchor="start" dominant-baseline="text-before-edge">Billing + Production + Critical</text>
<text x="178" y="635.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">Add tags manually, in bulk or by CSV. Manual location choices stay pinned.</text>
<line x1="44" y1="718" x2="1216" y2="718" stroke="#DEE0E6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="733.0" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">Mapping example • the same exact network cannot be assigned to two different locations.</text>
<text x="1216" y="760.0" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#686B78" text-anchor="end" dominant-baseline="text-before-edge">Created by Pratik Srivastava</text>
