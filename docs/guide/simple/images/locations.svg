<text x="768" y="235.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#E60012" text-anchor="middle" dominant-baseline="text-before-edge">More specific</text>
<text x="630" y="462.0" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="600" fill="#202127" text-anchor="middle" dominant-baseline="text-before-edge">The smaller matching network wins</text>
<text x="630" y="508.0" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">A /24 can sit inside another location&#x27;s /16.</text>
