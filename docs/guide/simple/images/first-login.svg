<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="960" viewBox="0 0 1260 960" role="img" aria-labelledby="title desc">
<title id="title">Sign in then replace the temporary password</title>
<desc id="desc">Illustration of the current first login screens • a fresh empty account database only. Created by Pratik Srivastava.</desc>
