<rect x="695" y="668" width="490" height="59" rx="10" fill="#E60012" stroke="#E60012" stroke-width="1.5"/>
<text x="940" y="686.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="text-before-edge">Change password</text>
<text x="630" y="809.0" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="600" fill="#202127" text-anchor="middle" dominant-baseline="text-before-edge">Use a personal password of 12–256 characters before entering the workspace.</text>
<text x="630" y="850.0" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Built in admin is permanent. Only its password can be changed or reset.</text>
<line x1="44" y1="888" x2="1216" y2="888" stroke="#DEE0E6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="903.0" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">UI illustration, not a screenshot • existing installations keep their existing users and passwords.</text>
<text x="1216" y="930.0" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#686B78" text-anchor="end" dominant-baseline="text-before-edge">Created by Pratik Srivastava</text>
