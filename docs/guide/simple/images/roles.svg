<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="780" viewBox="0 0 1260 780" role="img" aria-labelledby="title desc">
<title id="title">Three roles with clear responsibilities</title>
<desc id="desc">Local accounts and organisation SSO use the same permissions. Created by Pratik Srivastava.</desc>
<rect width="1260" height="780" fill="#FFFFFF"/>
<text x="44" y="28.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#E60012" text-anchor="start" dominant-baseline="text-before-edge">Prṛthak  /  Simple visual guide</text>
<text x="44" y="66.0" font-family="DejaVu Sans,sans-serif" font-size="35" font-weight="600" fill="#13151C" text-anchor="start" dominant-baseline="text-before-edge">Three roles with clear responsibilities</text>
<text x="44" y="117.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">Local accounts and organisation SSO use the same permissions.</text>
<rect x="44" y="207" width="356" height="319" rx="18" fill="#FFFFFF" stroke="#DEE0E6" stroke-width="1.5"/>
<polyline points="187.4,271.0 199.86666666666667,257.4 218.0,250.6 236.13333333333333,257.4 248.6,271.0 236.13333333333333,284.6 218.0,291.4 199.86666666666667,284.6 187.4,271.0" fill="none" stroke="#E60012" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="218.0" cy="271.0" r="10.2" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<text x="222" y="339.0" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="600" fill="#202127" text-anchor="middle" dominant-baseline="text-before-edge">Read Only</text>
<text x="222" y="402.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Look at servers</text>
<text x="222" y="437.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">View rules and traffic</text>
<text x="222" y="472.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Read alerts and history</text>
<rect x="452" y="207" width="356" height="319" rx="18" fill="#FFFFFF" stroke="#DEE0E6" stroke-width="1.5"/>
<circle cx="626.0" cy="256.26666666666665" r="11.333333333333332" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<rect x="605.6" y="274.4" width="40.8" height="24.933333333333334" rx="14.733333333333333" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<text x="630" y="339.0" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="600" fill="#202127" text-anchor="middle" dominant-baseline="text-before-edge">Admin</text>
<text x="630" y="402.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Manage servers and tags</text>
<text x="630" y="437.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Create and apply policies</text>
<text x="630" y="472.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Run approved learning</text>
<rect x="860" y="207" width="356" height="319" rx="18" fill="#FFF2F3" stroke="#DEE0E6" stroke-width="1.5"/>
<polygon points="1034.0,241.53333333333333 1057.8,251.73333333333332 1054.4,277.8 1046.4666666666667,291.4 1034.0,301.6 1021.5333333333333,291.4 1013.6,277.8 1010.2,251.73333333333332" fill="#FFFFFF" stroke="#E60012" stroke-width="2.4"/>
<line x1="1022.6666666666666" y1="269.8666666666667" x2="1031.7333333333333" y2="278.93333333333334" stroke="#E60012" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1031.7333333333333" y1="278.93333333333334" x2="1046.4666666666667" y2="261.93333333333334" stroke="#E60012" stroke-width="2.4" stroke-linecap="round"/>
<text x="1038" y="339.0" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="600" fill="#202127" text-anchor="middle" dominant-baseline="text-before-edge">Super Admin</text>
<text x="1038" y="402.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Everything Admin can do</text>
<text x="1038" y="437.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Create users and set roles</text>
<text x="1038" y="472.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#686B78" text-anchor="middle" dominant-baseline="text-before-edge">Manage platform settings</text>
<rect x="80.5" y="599.25" width="34.0" height="24.65" rx="3.4" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<rect x="87.3" y="582.25" width="20.4" height="23.8" rx="9.35" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<rect x="80.5" y="599.25" width="34.0" height="24.65" rx="3.4" fill="#FFFFFF" stroke="#E60012" stroke-width="2.3"/>
<circle cx="97.5" cy="610.3" r="2.55" fill="#E60012" stroke="#E60012" stroke-width="2.3"/>
<line x1="97.5" y1="612.85" x2="97.5" y2="617.95" stroke="#E60012" stroke-width="2.4" stroke-linecap="round"/>
<text x="148" y="576.0" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="600" fill="#202127" text-anchor="start" dominant-baseline="text-before-edge">Built in admin is permanent</text>
<text x="148" y="620.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">Change or reset its password. It cannot be deleted, disabled, renamed or demoted.</text>
<line x1="44" y1="708" x2="1216" y2="708" stroke="#DEE0E6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="723.0" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#686B78" text-anchor="start" dominant-baseline="text-before-edge">Permission illustration • only Super Admin can create users or change any user&#x27;s role.</text>
<text x="1216" y="750.0" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#686B78" text-anchor="end" dominant-baseline="text-before-edge">Created by Pratik Srivastava</text>
</svg>
