/text><line x1="540" y1="138" x2="45" y2="138" stroke="#d71920" stroke-width="1.4" marker-end="url(#arrow-auth)"/><text x="292.5" y="132.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#586779">4  Redirect: code + state</text><line x1="45" y1="166" x2="285" y2="166" stroke="#d71920" stroke-width="1.4" marker-end="url(#arrow-auth)"/><text x="165.0" y="160.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#586779">5  Callback: code + state</text><line x1="285" y1="194" x2="540" y2="194" stroke="#d71920" stroke-width="1.4" marker-end="url(#arrow-auth)"/><text x="412.5" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#586779">6  HTTPS code exchange / JWKS</text><line x1="285" y1="222" x2="45" y2="222" stroke="#d71920" stroke-width="1.4" marker-end="url(#arrow-auth)"/><text x="165.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#586779">7  Enabled DB role → session</text><text x="20" y="265" font-family="Arial,sans-serif" font-size="10" fill="#586779">Secret stays on server; verified tid:oid must match enabled application access</text></svg>